{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="(% static 'main/style.css' %}">
    <title>{% block title %}AppStore{% endblock %}</title>
</head>
<body>
    <h1>AppStore</h1>
    <nav>
        <a href="{% url 'index' %}"> Главная </a>
        <a href="{% url 'new' %}"> Новые приложения </a>
         <a href="{% url 'about' %}"> О магазине </a>
        <a href="{% url 'free' %}"> Бесплатные </a>
        <a href="{% url 'top' %}">Топ по цене</a>
    </nav>

  <form method="GET" action="{% url 'index' %}">
    <input type="text" name="q" placeholder="Поиск приложений..." value="{{ q }}">
      {% if reguest.GET.sort %}
        <input type="text" name="sort" value="Поиск приложений..." value="{{ q }}">
      {% endif %}
    <button type="submit">Найти</button>
  </form>

    {% block content %}{% endblock %}
</body>
</html>
