{% extends 'main/base.html' %}

{% block title %}
    {{ app.name }} - AppStore
{% endblock %}

{% block content %}

<p>
    <a href="{% url 'main:index' %}">
        ← ко всем приложениям
    </a>
</p>

<h2>{{ app.name }}</h2>

<p>
    Категория:
    {% if app.category %}
        <a href="{% url 'main:category_detail' app.category.id %}">
            {{ app.category }}
        </a>
    {% else %}
        без категории
    {% endif %}
</p>

{% endblock %}
