{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'main/style.css' %}">
    <title>{% block title %}AppStore{% endblock %}</title>
</head>
<body>
    <h1>AppStore</h1>
    <nav>
        <a href="{% url 'main:index' %}">Главная</a>
        <a href="{% url 'main:new' %}">Новые приложения</a>
        <a href="{% url 'main:about' %}">О магазине</a>
        <a href="{% url 'main:free_apps' %}">Бесплатные</a>
        <a href="{% url 'main:paid_apps' %}">Платные</a>
    </nav>

{% if request.path == '/free/' %}
    <strong>
       <a href="{% url 'main:free' %}">Бесплатные</a>
    </strong>

{% endif %}

    <form method="GET" action="{% url 'main:index' %}">
        <input type="text" name="q" placeholder="Поиск приложений..." value="{{ q }}">
        {% if request.GET.sort %}
            <input type="hidden" name="sort" value="{{ request.GET.sort }}">
        {% endif %}
        <button type="submit">Найти</button>
    </form>

    {% block content %}

{% endblock %}

</body>
</html>
