{% extends 'main/base.html' %}
{% load django_bootstrap5 %}

{% block title %}Добавить приложение - AppStore{% endblock %}

{% block content %}
    <h2>Добавить приложение</h2>

    <p>Заполните карточку товара, чтобы добавить приложение</p>

    <form method="post" action="{% url 'main:add_app' %}" enctype="multipart/form-data">
        {% csrf_token %}
        {% bootstrap_form form %}
        <button type="submit" class="btn btn primary">Опубликовать приложение</button>
    </form>
{% endblock %}
